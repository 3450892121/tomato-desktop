<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- media-src 是为「视频播放器」开的：视频/音频走本地媒体协议 tomato-media://（主进程按 Range 分块回传），
       拖拽文件与 canvas 录制的预览仍可能用 blob:，所以两者都放行；不放开 file:（界面进程拿不到本地路径） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: tomato-media:; style-src 'self'; script-src 'self'" />
  <title>番茄工具箱</title>
  <link rel="stylesheet" href="theme.css" />
  <!-- 通用组件库（按钮/输入/卡片/弹窗/进度 + 统一动效） -->
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="shell">
    <!-- 左侧：工具列表（由 registry.js 自动渲染） -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">🍅</span>
        <span class="sidebar-text">
          <span class="sidebar-title">番茄工具箱</span>
          <span class="sidebar-version" id="appVersion" title="软件版本">v-</span>
        </span>
      </div>
      <nav class="tool-nav" id="toolNav"><!-- 工具项由 shell.js 渲染 --></nav>
      <div class="sidebar-footer">
        <button class="side-btn" id="btnSettings">⚙ 设置</button>
        <button class="side-btn" id="btnHelp">? 帮助</button>
        <!-- 长按左侧条目即可拖动排序（无需排序模式）；此按钮只在用户排过序时由 shell.js 显示 -->
        <button class="side-btn" id="btnSortReset" title="长按左侧条目拖动可调整顺序；点此恢复默认顺序" hidden>↺ 恢复默认顺序</button>
      </div>
    </aside>

    <!-- 右侧：当前工具 -->
    <main class="workspace">
      <header class="topbar">
        <div class="topbar-status" id="statusText">欢迎使用</div>
        <div class="topbar-info" id="infoText">分辨率: --- x --- ｜ 耗时: --- ms</div>
        <!-- 任务中心入口：显示进行中/排队的数量徽标（0 个时不显示徽标）；面板由 shell.js 持有 -->
        <button class="topbar-tasks" id="btnTasks" type="button" title="任务中心（在跑的任务、进度、结果）">
          <span>任务</span><span class="topbar-tasks-badge" id="taskBadge" hidden>0</span>
        </button>
        <!-- 外观切换：浅色 / 深色 / 跟随系统（三态循环，当前状态在按钮上显示） -->
        <button class="topbar-theme" id="btnTheme" type="button" title="切换外观（浅色 / 深色 / 跟随系统）">
          <span id="themeIcon">🌗</span><span id="themeLabel">跟随系统</span>
        </button>
      </header>
      <section class="tool-host" id="toolHost"><!-- 工具界面挂载点 --></section>
    </main>

    <!-- 处理进度（框架级，所有工具共用） -->
    <div class="progress" id="progressBar" hidden>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">处理中…</div>
    </div>
  </div>

  <script type="module" src="shell.js"></script>
</body>
</html>
